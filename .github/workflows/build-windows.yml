name: Build Windows installer

# Produces the downloadable LibreCrawl Windows .exe.
#
# - every push/PR touching the app: builds the installer and uploads it as a
#   workflow artifact (14 days)
# - tagging vX.Y.Z: also attaches the installer to a GitHub Release
# - manual run: Actions > "Build Windows installer" > Run workflow
#
# PyInstaller cannot cross-compile, so this has to run on a Windows runner.
# Running the workflow is also how a maintainer ships a release without a
# Windows machine of their own.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths:
      - '**.py'
      - 'requirements.txt'
      - 'VERSION'
      - 'web/**'
      - 'packaging/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (blank = contents of VERSION)'
        required: false
      skip_chromium:
        description: 'Build without bundled Chromium (small, no JS rendering)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if (-not $version) { $version = (Get-Content VERSION -Raw).Trim() }
          # A tag build overrides the file, so `git tag v1.2.0` always ships 1.2.0.
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart('v')
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building LibreCrawl $version"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build app + installer
        shell: pwsh
        run: |
          $params = @{ VersionOverride = '${{ steps.version.outputs.version }}' }
          if ('${{ inputs.skip_chromium }}' -eq 'true') { $params['SkipChromium'] = $true }
          try {
            ./packaging/build_windows.ps1 @params *>&1 | Tee-Object -FilePath build.log
            if ($LASTEXITCODE -ne 0) {
              throw "build_windows.ps1 exited with code $LASTEXITCODE"
            }
          } catch {
            # Surface the failure where it is visible without downloading logs:
            # workflow annotations are readable from the API and the run page.
            Write-Host "::error::Build failed: $($_.Exception.Message)"
            if (Test-Path build.log) {
              # Annotations are readable from the API and the run page, so put
              # the actual error there rather than 80 lines of pip/pyi INFO.
              $errors = Select-String -Path build.log -Pattern 'ERROR|Error:|Traceback|Exception|failed|Fatal' |
                        Select-Object -Last 30
              if (-not $errors) { $errors = Get-Content build.log -Tail 30 }
              foreach ($e in $errors) {
                $text = if ($e -is [string]) { $e } else { $e.Line }
                if ($text -match '\S') { Write-Host "::error::$text" }
              }
            }
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: LibreCrawl-Setup-${{ steps.version.outputs.version }}
          path: dist/installer/LibreCrawl-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload portable folder (for debugging / advanced users)
        uses: actions/upload-artifact@v4
        with:
          name: LibreCrawl-portable-${{ steps.version.outputs.version }}
          path: dist/LibreCrawl/**
          if-no-files-found: warn
          retention-days: 7

      - name: Attach installer to release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/LibreCrawl-Setup-*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
